<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Presenter</title>
<style>
:root{--bg:#111113;--card:#1d1d1f;--ink:#f5f5f7;--gray:#8e8e93;--yellow:#F2B33D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
.grid{display:grid;grid-template-columns:1.45fr 1fr;grid-template-rows:auto 1fr;gap:18px;height:100%;padding:18px}
.lab{font-size:13px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#05070c}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#notes{background:var(--card);border-radius:16px;padding:22px;font-size:24px;line-height:1.5;overflow:auto}
#notes b{color:var(--yellow)}
.side{display:flex;flex-direction:column;gap:18px}
#timer{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
#timer.warn{color:var(--yellow)}#timer.over{color:#ff453a}
.meta{color:var(--gray);font-size:18px}
.hint{color:var(--gray);font-size:14px;margin-top:auto}
button{background:#2c2c2e;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;margin-right:8px;cursor:pointer}
</style>
</head>
<body>
<div class="grid">
  <div><div class="lab">Now · <span id="num">–</span> / <span id="tot">–</span></div><div class="frame"><iframe id="cur" src="index.html?preview=1#0"></iframe></div></div>
  <div class="side">
    <div><div class="lab">Next</div><div class="frame"><iframe id="nxt" src="index.html?preview=1#1"></iframe></div></div>
    <div><div id="timer">00:00</div><div class="meta">Talk: 7 min · yellow at 6:00 · red at 7:00</div>
      <div style="margin-top:12px"><button id="ts">Start</button><button id="tr">Reset</button></div></div>
  </div>
  <div id="notes" style="grid-column:1/3">Open the deck in another window first (http://localhost:8000/).</div>
</div>
<script>
const $=id=>document.getElementById(id);
const send=c=>fetch('/api/cmd',{method:'POST',body:JSON.stringify({cmd:c})}).catch(()=>{});
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();send('next')}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();send('prev')}});
let t0=null,acc=0;const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
$('ts').onclick=()=>{if(t0){acc+=(Date.now()-t0)/1000;t0=null;$('ts').textContent='Start'}else{t0=Date.now();$('ts').textContent='Pause'}};
$('tr').onclick=()=>{t0=t0?Date.now():null;acc=0};
setInterval(()=>{const s=acc+(t0?(Date.now()-t0)/1000:0);$('timer').textContent=fmt(s);$('timer').className=s>=420?"over":s>=360?"warn":''},250);
let last=-1;
async function poll(){
  try{const st=await (await fetch('/api/state',{cache:'no-store'})).json();
    if(st.slide!==last){last=st.slide;$('num').textContent=st.slide+1;$('tot').textContent=st.total;
      const N=st.notes||{},esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
      $('notes').innerHTML=`<b>${esc(N.line)}</b><ul style="margin:10px 0 0 1.2em">${(N.say||[]).map(x=>x.startsWith('[CLICK]')?'<li style="list-style:none;margin-left:-1.2em;color:#FFB340"><span style="background:#FF9F0A;color:#000;border-radius:99px;padding:1px 10px;font-size:14px;font-weight:800;margin-right:8px">CLICK</span>'+esc(x.slice(7).trim())+'</li>':'<li>'+esc(x)+'</li>').join('')}</ul><div class="meta" style="margin-top:10px">If asked: ${esc(N.if_asked)} · ${N.time||''} s</div>`;
      $('cur').contentWindow.location.hash=st.slide;$('nxt').contentWindow.location.hash=Math.min(st.slide+1,st.total)}
  }catch(e){}
  setTimeout(poll,400);
}
poll();
</script>
</body>
</html>
